<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">HealthScan AI medical report workflow preview</title><desc id="desc">The modern report workspace separates PDF upload, extraction results, original report text, and AI explanation sections.</desc>
<defs><linearGradient id="h" x2="1" y2="1"><stop stop-color="#12283b"/><stop offset=".7" stop-color="#173c50"/><stop offset="1" stop-color="#087b81"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#16324c" flood-opacity=".05"/></filter></defs>
<rect width="1440" height="1120" fill="#f3f7fb"/><rect width="1440" height="145" fill="url(#h)"/>
<rect x="68" y="40" width="55" height="55" rx="16" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".28"/><text x="95.5" y="78" font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#d7fffb">✚</text>
<text x="144" y="43" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#a8d7d9">PERSONAL HEALTH INTELLIGENCE</text><text x="144" y="77" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">HealthScan <tspan fill="#76e0d8">AI</tspan></text><text x="144" y="104" font-family="Arial,sans-serif" font-size="14" fill="#dbecee">Your health information, made clearer.</text>
<text x="58" y="203" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#087f8c">DOCUMENT INTELLIGENCE</text><text x="58" y="243" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#102539">Medical report lab</text><text x="58" y="272" font-family="Arial,sans-serif" font-size="14" fill="#64778b">Two distinct results: structured vital extraction and an AI-generated explanation.</text>
<!-- workflow -->
<g font-family="Arial,sans-serif"><rect x="58" y="296" width="413" height="53" rx="13" fill="#e8f7f6" stroke="#cfe9e7"/><circle cx="84" cy="322" r="14" fill="#087f8c"/><text x="84" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="108" y="318" font-size="13" font-weight="700" fill="#175a60">Upload &amp; read PDF</text><text x="108" y="336" font-size="11" fill="#5f7d86">Extract selectable document text</text>
<rect x="487" y="296" width="414" height="53" rx="13" fill="#eef1ff" stroke="#dce2fc"/><circle cx="513" cy="322" r="14" fill="#536fda"/><text x="513" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="537" y="318" font-size="13" font-weight="700" fill="#384f9e">Extract vital measurements</text><text x="537" y="336" font-size="11" fill="#6978a5">Find supported values in text</text>
<rect x="917" y="296" width="465" height="53" rx="13" fill="#f1edfb" stroke="#e2daf8"/><circle cx="943" cy="322" r="14" fill="#7b61c9"/><text x="943" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="967" y="318" font-size="13" font-weight="700" fill="#5a479b">Explain report with AI</text><text x="967" y="336" font-size="11" fill="#8375ac">Generate a plain-language explanation</text></g>
<!-- upload -->
<rect x="58" y="374" width="1324" height="138" rx="18" fill="#fff" stroke="#e1e9f0" filter="url(#s)"/><text x="85" y="411" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#102539">Upload a medical PDF</text><text x="85" y="435" font-family="Arial,sans-serif" font-size="12" fill="#64778b">Choose a text-based PDF. Scanned image documents may require OCR.</text>
<rect x="85" y="454" width="894" height="39" rx="10" fill="#fbfdff" stroke="#dce6ee" stroke-dasharray="4 3"/><text x="102" y="478" font-family="Arial,sans-serif" font-size="12" fill="#7d8fa0">Select PDF file…</text><rect x="996" y="452" width="355" height="42" rx="11" fill="#087f8c"/><text x="1173" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">1. Upload &amp; read PDF</text>
<!-- extraction result -->
<rect x="58" y="535" width="1324" height="211" rx="18" fill="#fff" stroke="#dfe8f0" filter="url(#s)"/><rect x="83" y="559" width="42" height="42" rx="13" fill="#e6f7f4"/><text x="104" y="586" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#087d83">⌁</text><text x="140" y="565" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#71879a">STRUCTURED DATA</text><text x="140" y="588" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#17344a">Extracted measurements</text><text x="140" y="610" font-family="Arial,sans-serif" font-size="11" fill="#647b8e">This is data extraction, not an AI interpretation. Example layout values below are fictitious.</text><rect x="1223" y="558" width="132" height="28" rx="14" fill="#e8f7f6" stroke="#d4efed"/><text x="1289" y="576" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0b737d">4 of 4 found</text>
<g font-family="Arial,sans-serif"><rect x="83" y="630" width="295" height="86" rx="13" fill="#f5fbfa" stroke="#d9eeea"/><rect x="394" y="630" width="295" height="86" rx="13" fill="#f5fbfa" stroke="#d9eeea"/><rect x="705" y="630" width="295" height="86" rx="13" fill="#f5fbfa" stroke="#d9eeea"/><rect x="1016" y="630" width="339" height="86" rx="13" fill="#f5fbfa" stroke="#d9eeea"/><text x="101" y="654" font-size="11" font-weight="700" fill="#698093">Heart rate</text><text x="101" y="693" font-size="27" font-weight="800" fill="#145d61">72 <tspan font-size="11" fill="#6a8494">bpm</tspan></text><text x="412" y="654" font-size="11" font-weight="700" fill="#698093">Blood oxygen</text><text x="412" y="693" font-size="27" font-weight="800" fill="#145d61">98 <tspan font-size="11" fill="#6a8494">%</tspan></text><text x="723" y="654" font-size="11" font-weight="700" fill="#698093">Blood pressure</text><text x="723" y="693" font-size="27" font-weight="800" fill="#145d61">120/80 <tspan font-size="11" fill="#6a8494">mmHg</tspan></text><text x="1034" y="654" font-size="11" font-weight="700" fill="#698093">Temperature</text><text x="1034" y="693" font-size="27" font-weight="800" fill="#145d61">36.8 <tspan font-size="11" fill="#6a8494">°C</tspan></text></g>
<!-- source text -->
<rect x="58" y="769" width="1324" height="59" rx="14" fill="#fff" stroke="#dfe8f0"/><text x="84" y="793" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#28485e">Original text extracted from PDF</text><text x="84" y="812" font-family="Arial,sans-serif" font-size="11" fill="#7d8fa0">Source text · reference only</text><text x="1347" y="804" text-anchor="end" font-family="Arial,sans-serif" font-size="17" fill="#7d8fa0">＋</text>
<!-- AI explanation -->
<rect x="58" y="850" width="1324" height="210" rx="18" fill="#fff" stroke="#dfe8f0" filter="url(#s)"/><path d="M76 850 H1364 Q1382 850 1382 868" fill="none" stroke="#536fda" stroke-width="4"/><rect x="83" y="872" width="42" height="42" rx="13" fill="#edf0ff"/><text x="104" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#4c63c7">✧</text><text x="140" y="878" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#71879a">AI-POWERED EXPLANATION</text><text x="140" y="902" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#17344a">Understanding your report</text><text x="140" y="923" font-family="Arial,sans-serif" font-size="11" fill="#647b8e">Example presentation only — analysis text shown here is illustrative, not a live AI response.</text>
<rect x="83" y="941" width="397" height="83" rx="12" fill="#f7f9ff" stroke="#e1e7fa"/><rect x="495" y="941" width="397" height="83" rx="12" fill="#f7f9ff" stroke="#e1e7fa"/><rect x="907" y="941" width="448" height="83" rx="12" fill="#f7f9ff" stroke="#e1e7fa"/>
<g font-family="Arial,sans-serif"><text x="102" y="965" font-size="12" font-weight="800" fill="#344c9b">Report Summary</text><text x="102" y="986" font-size="11" fill="#4f6379">A short overview of the document's</text><text x="102" y="1003" font-size="11" fill="#4f6379">stated purpose and main findings.</text><text x="514" y="965" font-size="12" font-weight="800" fill="#344c9b">Important Values</text><text x="514" y="986" font-size="11" fill="#4f6379">Explain relevant findings using the</text><text x="514" y="1003" font-size="11" fill="#4f6379">context and ranges printed in the report.</text><text x="926" y="965" font-size="12" font-weight="800" fill="#344c9b">Simple Explanation</text><text x="926" y="986" font-size="11" fill="#4f6379">An accessible explanation without a</text><text x="926" y="1003" font-size="11" fill="#4f6379">medical diagnosis or treatment instruction.</text></g>
<text x="60" y="1091" font-family="Arial,sans-serif" font-size="11" fill="#8393a2">HEALTHSCAN AI · Medical report UI preview · Example values and descriptions are illustrative only</text>
