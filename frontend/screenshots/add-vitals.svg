<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">HealthScan AI manual vital entry preview</title><desc id="desc">The current HealthScan AI visual design applied to the manual entry form and example readings table.</desc>
<defs><linearGradient id="h" x2="1" y2="1"><stop stop-color="#12283b"/><stop offset=".7" stop-color="#173c50"/><stop offset="1" stop-color="#087b81"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#16324c" flood-opacity=".055"/></filter></defs>
<rect width="1440" height="1000" fill="#f3f7fb"/><rect width="1440" height="145" fill="url(#h)"/>
<rect x="68" y="40" width="55" height="55" rx="16" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".28"/><text x="95.5" y="78" font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#d7fffb">✚</text>
<text x="144" y="43" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#a8d7d9">PERSONAL HEALTH INTELLIGENCE</text><text x="144" y="77" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">HealthScan <tspan fill="#76e0d8">AI</tspan></text><text x="144" y="104" font-family="Arial,sans-serif" font-size="14" fill="#dbecee">Your health information, made clearer.</text>
<text x="60" y="205" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#087f8c">YOUR HEALTH RECORD</text><text x="60" y="247" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#102539">Add New Vitals</text><text x="60" y="276" font-family="Arial,sans-serif" font-size="15" fill="#64778b">Enter readings from your device or a verified medical measurement.</text>
<rect x="58" y="306" width="850" height="418" rx="20" fill="#fff" stroke="#e1e9f0" filter="url(#s)"/>
<text x="88" y="350" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#102539">Record a measurement</text><text x="88" y="375" font-family="Arial,sans-serif" font-size="13" fill="#64778b">Only enter values you have actually measured.</text>
<!-- inputs -->
<g font-family="Arial,sans-serif">
 <text x="88" y="418" font-size="12" font-weight="700" fill="#40596e">Heart rate (bpm)</text><rect x="88" y="431" width="375" height="48" rx="10" fill="#fbfdff" stroke="#dce6ee"/><text x="105" y="460" font-size="13" fill="#9aa8b5">e.g. 72</text>
 <text x="490" y="418" font-size="12" font-weight="700" fill="#40596e">Blood oxygen (SpO₂ %)</text><rect x="490" y="431" width="375" height="48" rx="10" fill="#fbfdff" stroke="#dce6ee"/><text x="507" y="460" font-size="13" fill="#9aa8b5">e.g. 98</text>
 <text x="88" y="512" font-size="12" font-weight="700" fill="#40596e">Systolic pressure (mmHg)</text><rect x="88" y="525" width="375" height="48" rx="10" fill="#fbfdff" stroke="#dce6ee"/><text x="105" y="554" font-size="13" fill="#9aa8b5">e.g. 120</text>
 <text x="490" y="512" font-size="12" font-weight="700" fill="#40596e">Diastolic pressure (mmHg)</text><rect x="490" y="525" width="375" height="48" rx="10" fill="#fbfdff" stroke="#dce6ee"/><text x="507" y="554" font-size="13" fill="#9aa8b5">e.g. 80</text>
 <text x="88" y="606" font-size="12" font-weight="700" fill="#40596e">Temperature (°C)</text><rect x="88" y="619" width="375" height="48" rx="10" fill="#fbfdff" stroke="#dce6ee"/><text x="105" y="648" font-size="13" fill="#9aa8b5">e.g. 36.8</text>
</g>
<rect x="88" y="682" width="190" height="44" rx="11" fill="#087f8c"/><text x="183" y="709" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Save vital readings</text>
<!-- right note -->
<rect x="930" y="306" width="452" height="194" rx="20" fill="#eaf8f6" stroke="#d0eeea" filter="url(#s)"/><rect x="956" y="332" width="40" height="40" rx="12" fill="#d3f0eb"/><text x="976" y="359" font-family="Arial,sans-serif" font-size="20" fill="#087f8c" text-anchor="middle">✓</text><text x="1012" y="349" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#155a5d">Helpful tip</text><text x="956" y="402" font-family="Arial,sans-serif" font-size="13" fill="#4d6e77">Use consistent units and record the date</text><text x="956" y="424" font-family="Arial,sans-serif" font-size="13" fill="#4d6e77">and context of your measurements. The</text><text x="956" y="446" font-family="Arial,sans-serif" font-size="13" fill="#4d6e77">dashboard helps visualize changes—it does</text><text x="956" y="468" font-family="Arial,sans-serif" font-size="13" fill="#4d6e77">not diagnose a health condition.</text>
<rect x="930" y="520" width="452" height="204" rx="20" fill="#fff" stroke="#e1e9f0" filter="url(#s)"/><text x="956" y="560" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#102539">Your health data</text><text x="956" y="584" font-family="Arial,sans-serif" font-size="12" fill="#64778b">Saved readings appear in your history and trend charts.</text><path d="M956 610 H1354" stroke="#e5edf3"/><text x="956" y="638" font-family="Arial,sans-serif" font-size="12" fill="#64778b">Heart rate</text><text x="1325" y="638" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17344a">bpm</text><path d="M956 652 H1354" stroke="#edf1f5"/><text x="956" y="680" font-family="Arial,sans-serif" font-size="12" fill="#64778b">Blood pressure</text><text x="1325" y="680" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17344a">mmHg</text>
<rect x="58" y="755" width="1324" height="185" rx="20" fill="#fff" stroke="#e1e9f0" filter="url(#s)"/><text x="88" y="798" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#102539">Recent readings</text><text x="88" y="822" font-family="Arial,sans-serif" font-size="13" fill="#64778b">Your saved records will appear here.</text>
<rect x="88" y="843" width="1264" height="42" rx="9" fill="#f4f8fb"/><g font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#5d7588"><text x="108" y="869">RECORDED AT</text><text x="425" y="869">HEART RATE</text><text x="620" y="869">SpO₂</text><text x="810" y="869">BLOOD PRESSURE</text><text x="1050" y="869">TEMPERATURE</text></g><text x="720" y="912" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8393a2">No saved readings in this preview.</text>
<text x="60" y="974" font-family="Arial,sans-serif" font-size="11" fill="#8393a2">HEALTHSCAN AI · Manual vital entry UI preview</text>
</svg>